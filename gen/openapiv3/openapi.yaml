                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /wfm/lookups/working_schedules/{id}:
        get:
            tags:
                - WorkingScheduleService
            operationId: WorkingScheduleService_ReadWorkingSchedule
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: fields
