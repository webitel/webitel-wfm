        ShiftTemplateDay:
            type: object
            properties:
                ranges:
                    type: array
                    items:
                        $ref: '#/components/schemas/ShiftTemplateRange'
            description: |-
                ShiftTemplateDay holds the shifts of one day of week, several when the agent works
                 on different skills at different hours.
        ShiftTemplatePause:
            type: object
            properties:
                start:
                    type: integer
                    description: Minutes from midnight.
                    format: int32
                duration:
                    type: integer
                    description: Minutes.
                    format: int32
                cause:
                    $ref: '#/components/schemas/LookupEntity'
            description: |-
                ShiftTemplatePause is a pause of every day at a wall-clock time. In a range that
                 crosses midnight, a pause after 00:00 belongs to the shift of the previous day.
        ShiftTemplateRange:
            type: object
            properties:
                start:
                    type: integer
                    format: int32
                end:
                    type: integer
                    format: int32
            description: |-
                ShiftTemplateRange is one shift of a day, in minutes from midnight. An end before the
                 start crosses midnight: 1320 to 360 is 22:00 to 06:00, a shift of the day it starts on.
        ShiftTemplateTime:
            type: object
            properties:
