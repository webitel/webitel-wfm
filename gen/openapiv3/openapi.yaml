components:
    schemas:
        Absence:
            type: object
            properties:
                id:
                    type: string
                domainId:
                    type: string
                createdAt:
                    type: string
                createdBy:
                    $ref: '#/components/schemas/LookupEntity'
                updatedAt:
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/LookupEntity'
                typeId:
                    type: integer
                    format: enum
                absentAt:
                    type: string
                    description: 'A date as in DateRange: 00:00 UTC of the day, epoch milliseconds.'
        AgentAbsences:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/LookupEntity'
                absences:
                    type: array
                    items:
                        $ref: '#/components/schemas/Absence'
        AgentSchedule:
            type: object
            properties:
                date:
                    type: string
                    description: 'The working date, a date as in DateRange: 00:00 UTC of the day, epoch milliseconds.'
                locked:
                    type: boolean
                absence:
                    type: integer
                    description: A day has an absence or shifts, not both.
                    format: enum
                shifts:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShift'
        AgentScheduleShift:
            type: object
            properties:
                id:
                    type: string
                domainId:
                    type: string
                createdAt:
                    type: string
                createdBy:
                    $ref: '#/components/schemas/LookupEntity'
                updatedAt:
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/LookupEntity'
                startAt:
                    type: string
                    description: Epoch milliseconds. The shift ends right before end_at, so the next one can start at end_at.
                endAt:
                    type: string
                pauses:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShiftPause'
                skills:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShiftSkill'
                workingDate:
                    type: string
                    description: |-
                        Set by the server. The working date, a date as in DateRange: the day the shift starts
                         on in the time zone of the schedule's calendar, so a night shift belongs to the day it
                         starts. 00:00 UTC of that day, epoch milliseconds.
                etag:
                    type: string
                    description: Version of the shift, returned by every read. Editing a shift requires it (WFM-99).
                source:
                    type: integer
                    description: Set by the server.
                    format: enum
                plannerRunId:
                    type: string
                    description: 'Set by the server for a planner''s shift: the planning run that wrote it.'
        AgentScheduleShiftPause:
            type: object
            properties:
                id:
                    type: string
                domainId:
                    type: string
                createdAt:
                    type: string
                createdBy:
                    $ref: '#/components/schemas/LookupEntity'
                updatedAt:
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/LookupEntity'
                startAt:
                    type: string
                    description: Epoch milliseconds, inside the shift.
                endAt:
                    type: string
                cause:
                    $ref: '#/components/schemas/LookupEntity'
        AgentScheduleShiftSkill:
            type: object
            properties:
                skill:
                    $ref: '#/components/schemas/LookupEntity'
                enabled:
                    type: boolean
            description: |-
                AgentScheduleShiftSkill switches a skill the agent already has on or off for the time
                 of the shift, with the agent's own capacity (WFM-114).
        AgentWorkingConditions:
            type: object
            properties:
                workingCondition:
                    $ref: '#/components/schemas/LookupEntity'
                pauseTemplate:
                    $ref: '#/components/schemas/LookupEntity'
        AgentWorkingSchedule:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/LookupEntity'
                schedule:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentSchedule'
        CalendarDay:
            type: object
            properties:
                ranges:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalendarRange'
                    description: Working hours, wall-clock minutes from midnight in the calendar's zone.
        CalendarRange:
            type: object
            properties:
                start:
                    type: integer
                    format: int32
                end:
                    type: integer
                    format: int32
        CreateAgentAbsenceRequest:
            type: object
            properties:
                agentId:
                    type: string
                item:
                    $ref: '#/components/schemas/Absence'
        CreateAgentAbsenceResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/Absence'
        CreateAgentsAbsencesRequest:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreateAgentsAbsencesRequest_absentType'
                agentIds:
                    type: array
                    items:
                        type: string
        CreateAgentsAbsencesRequest_absentType:
            type: object
            properties:
                typeId:
                    type: integer
                    format: enum
                dateFrom:
                    type: string
                    description: 'Dates as in DateRange: 00:00 UTC of the day, epoch milliseconds; date_to is included.'
                dateTo:
                    type: string
        CreateAgentsAbsencesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentAbsences'
        CreateAgentsWorkingScheduleShiftsRequest:
            type: object
            properties:
                workingScheduleId:
                    type: string
                date:
                    allOf:
                        - $ref: '#/components/schemas/DateRange'
                    description: Date from and Date to of the modal.
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/LookupEntity'
                days:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/ShiftTemplateDay'
                    description: |-
                        Map key is a day of week: 0 - Sunday, ..., 6 - Saturday. A day missing from the
                         map, one switched off in the modal, gets no shifts.
                pauses:
                    type: array
                    items:
                        $ref: '#/components/schemas/ShiftTemplatePause'
                    description: |-
                        Pauses of every day. Each belongs to the range that contains it; a pause outside
                         every range of a day refuses the request.
                skills:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShiftSkill'
                    description: |-
                        Skills switched on for the time of every shift the request creates. Different
                         skills for different ranges take separate requests.
            description: |-
                The Add shifts modal: a weekly template the server expands into shifts over a range
                 of dates (WFM-103). Hours are wall-clock minutes from midnight in the time zone of
                 the schedule's calendar, so a shift keeps its hours across a daylight saving change.
        CreateAgentsWorkingScheduleShiftsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentWorkingSchedule'
                skipped:
                    type: array
                    items:
                        $ref: '#/components/schemas/SkippedDay'
                    description: |-
                        Days the request left without shifts, and why: an absence, or a date another
                         active schedule locks (WFM-103).
        CreateForecastCalculationRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ForecastCalculation'
        CreateForecastCalculationResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ForecastCalculation'
        CreatePauseTemplateRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/PauseTemplate'
        CreatePauseTemplateResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/PauseTemplate'
        CreateShiftTemplateRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ShiftTemplate'
        CreateShiftTemplateResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ShiftTemplate'
        CreateWorkingConditionRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingCondition'
        CreateWorkingConditionResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingCondition'
        CreateWorkingScheduleRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingSchedule'
        CreateWorkingScheduleResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingSchedule'
        DateRange:
            type: object
            properties:
                from:
                    type: string
                to:
                    type: string
                    description: The last day, included.
            description: |-
                DateRange is an inclusive range of calendar dates. A date anywhere in WFM is a day, not
                 an instant: 00:00 UTC of that day in epoch milliseconds, the same for every client
                 whatever its time zone. Any other value is refused, so a local midnight shows up as
                 an error instead of a day shifted by the client's offset.
