                            schema:
                                $ref: '#/components/schemas/Status'
    /wfm/lookups/working_schedules/{id}/block_outside_activity:
        patch:
            tags:
                - WorkingScheduleService
            description: |-
                Switches blocking outside a shift on or off in a draft, pending or active schedule, with the
                 etag from a read; the response carries the schedule with the new etag. After creation it is
                 the only way to change it. Switched on in an active schedule, it also takes agents who are
                 online outside their shift offline.

                 Refusals: storage.working_schedule.archived; storage.working_schedule.version_conflict
                 (409) - the header changed since the read.
            operationId: WorkingScheduleService_UpdateWorkingScheduleBlockOutsideActivity
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWorkingScheduleBlockOutsideActivityRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateWorkingScheduleBlockOutsideActivityResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /wfm/lookups/working_schedules/{id}/forecast:
        get:
            tags:
                - WorkingScheduleService
            description: |-
                How many agents each hour of a period needs, from the forecast procedure of the team. The
                 procedure runs on every call and nothing is stored, so edits of the schedule do not change
                 the result. A team without a forecast calculation gets no hours.
            operationId: WorkingScheduleService_ReadWorkingScheduleForecast
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: date.from
                  in: query
                  schema:
                    type: string
                - name: date.to
                  in: query
                  description: The last day, included.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReadWorkingScheduleForecastResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /wfm/lookups/working_schedules/{id}/planned:
        get:
            tags:
                - WorkingScheduleService
            description: |-
                How many agents are on a shift and not on a pause, per 15 minutes and per day. It reads
                 only the schedule, so every edit of it changes the result.
            operationId: WorkingScheduleService_ReadWorkingSchedulePlanned
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: date.from
                  in: query
                  schema:
                    type: string
                - name: date.to
                  in: query
                  description: The last day, included.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReadWorkingSchedulePlannedResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /wfm/lookups/working_schedules/{id}/state:
        patch:
            tags:
                - WorkingScheduleService
            description: |-
                Moves the schedule to another state, in any order but out of archived, with the etag from
                 a read; the response carries the schedule with the new etag.

                 Moving to pending or active needs an answer about unplanned days: dates of the period where
                 an agent of the schedule has neither a shift nor an absence. Without fill_days_off the call
                 refuses with service.working_schedule.unplanned_days. The days off are written in the same
                 transaction, as absences.

                 Moving to active first checks the rules and refuses with
                 storage.working_schedule.activation_refused and violations:
                 storage.working_schedule.team_active - the team has another active schedule on overlapping
                 dates; storage.shift.locked_date or storage.shift.overlap - an agent works in another active
                 schedule on the same date or at the same time. storage.working_schedule.version_conflict
                 (409) - the header changed since the read.
            operationId: WorkingScheduleService_UpdateWorkingScheduleState
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWorkingScheduleStateRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateWorkingScheduleStateResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /wfm/lookups/working_schedules/{item.id}:
        put:
            tags:
                - WorkingScheduleService
            description: |-
                Updates the header of a draft schedule, with the etag from a read; the response carries the
                 new etag. A change of the team rebuilds the schedule: every shift is deleted and the agents
                 become the new team's agents the user has access to, so agents added by hand leave too. A
                 change of the calendar deletes every shift; a change of the dates deletes the shifts whose
                 working date falls outside the new period. The time scale, the name and Special time skills
                 keep the shifts. block_outside_activity is ignored: only
                 UpdateWorkingScheduleBlockOutsideActivity changes it.

                 Refusals: service.working_schedule.state - not a draft;
                 storage.working_schedule.version_conflict (409) - the header changed since the read.
            operationId: WorkingScheduleService_UpdateWorkingSchedule
            parameters:
                - name: item.id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWorkingScheduleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateWorkingScheduleResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        Absence:
            type: object
            properties:
                id:
                    type: string
                domainId:
                    type: string
                createdAt:
                    type: string
                createdBy:
                    $ref: '#/components/schemas/LookupEntity'
                updatedAt:
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/LookupEntity'
                typeId:
                    type: integer
                    format: enum
                absentAt:
                    type: string
                    description: 'A date as in DateRange: 00:00 UTC of the day, epoch milliseconds.'
        AgentAbsences:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/LookupEntity'
                absences:
                    type: array
                    items:
                        $ref: '#/components/schemas/Absence'
        AgentSchedule:
            type: object
            properties:
                date:
                    type: string
                    description: 'The working date, a date as in DateRange: 00:00 UTC of the day, epoch milliseconds.'
                locked:
                    type: boolean
                    description: The agent has shifts in another active schedule on this date, so no shift goes here.
                absence:
                    type: integer
                    description: A day has an absence or shifts, not both.
                    format: enum
                absenceId:
                    type: string
                    description: Id of the absence, to delete it.
                shifts:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShift'
        AgentScheduleShift:
            type: object
            properties:
                id:
                    type: string
                domainId:
                    type: string
                createdAt:
                    type: string
                createdBy:
                    $ref: '#/components/schemas/LookupEntity'
                updatedAt:
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/LookupEntity'
                startAt:
                    type: string
                    description: Epoch milliseconds. The shift ends right before end_at, so the next one can start at end_at.
                endAt:
                    type: string
                pauses:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShiftPause'
                skills:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShiftSkill'
                workingDate:
                    type: string
                    description: |-
                        Set by the server. The working date, a date as in DateRange: the day the shift starts
                         on in the time zone of the schedule's calendar, so a night shift belongs to the day it
                         starts. 00:00 UTC of that day, epoch milliseconds.
                etag:
                    type: string
                    description: Version of the shift, returned by every read. Editing and deleting a shift require it.
                source:
                    type: integer
                    description: Set by the server.
                    format: enum
                plannerRunId:
                    type: string
                    description: 'Set by the server for a planner''s shift: the planning run that wrote it.'
        AgentScheduleShiftPause:
            type: object
            properties:
                id:
                    type: string
                domainId:
                    type: string
                createdAt:
                    type: string
                createdBy:
                    $ref: '#/components/schemas/LookupEntity'
                updatedAt:
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/LookupEntity'
                startAt:
                    type: string
                    description: Epoch milliseconds, inside the shift.
                endAt:
                    type: string
                cause:
                    $ref: '#/components/schemas/LookupEntity'
        AgentScheduleShiftSkill:
            type: object
            properties:
                skill:
                    $ref: '#/components/schemas/LookupEntity'
                enabled:
                    type: boolean
            description: |-
                AgentScheduleShiftSkill switches a skill the agent already has on or off for the time
                 of the shift, with the agent's own capacity (WFM-114).
        AgentWorkingConditions:
            type: object
            properties:
                workingCondition:
                    $ref: '#/components/schemas/LookupEntity'
                pauseTemplate:
                    $ref: '#/components/schemas/LookupEntity'
        AgentWorkingSchedule:
            type: object
            properties:
                agent:
                    $ref: '#/components/schemas/LookupEntity'
                schedule:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentSchedule'
        CalendarDay:
            type: object
            properties:
                ranges:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalendarRange'
                    description: Working hours, wall-clock minutes from midnight in the calendar's zone.
        CalendarRange:
            type: object
            properties:
                start:
                    type: integer
                    format: int32
                end:
                    type: integer
                    format: int32
        CreateAgentAbsenceRequest:
            type: object
            properties:
                agentId:
                    type: string
                item:
                    $ref: '#/components/schemas/Absence'
                deleteShifts:
                    type: boolean
                    description: Deletes the agent's shifts on that day, the ones storage.absence.shifts_to_delete listed.
        CreateAgentAbsenceResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/Absence'
                deletedShifts:
                    type: array
                    items:
                        $ref: '#/components/schemas/DeletedShift'
                    description: |-
                        The shifts deleted. They can differ from the ones the refusal listed if the schedule
                         changed in between.
        CreateAgentsAbsencesRequest:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreateAgentsAbsencesRequest_absentType'
                agentIds:
                    type: array
                    items:
                        type: string
                deleteShifts:
                    type: boolean
                    description: As in CreateAgentAbsenceRequest.
        CreateAgentsAbsencesRequest_absentType:
            type: object
            properties:
                typeId:
                    type: integer
                    format: enum
                dateFrom:
                    type: string
                    description: 'Dates as in DateRange: 00:00 UTC of the day, epoch milliseconds; date_to is included.'
                dateTo:
                    type: string
        CreateAgentsAbsencesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentAbsences'
                deletedShifts:
                    type: array
                    items:
                        $ref: '#/components/schemas/DeletedShift'
                    description: As in CreateAgentAbsenceResponse.
        CreateAgentsWorkingScheduleShiftsRequest:
            type: object
            properties:
                workingScheduleId:
                    type: string
                date:
                    allOf:
                        - $ref: '#/components/schemas/DateRange'
                    description: Both ends included.
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/LookupEntity'
                days:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/ShiftTemplateDay'
                    description: |-
                        Map key is a day of week: 0 - Sunday, ..., 6 - Saturday. A day missing from the map gets
                         no shifts.
                pauses:
                    type: array
                    items:
                        $ref: '#/components/schemas/ShiftTemplatePause'
                    description: |-
                        Pauses of every day. Each belongs to the range that contains it; a pause outside
                         every range of a day refuses the request.
                skills:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentScheduleShiftSkill'
                    description: |-
                        Skills switched on for the time of every shift the request creates. Different
                         skills for different ranges take separate requests.
            description: |-
                A weekly template the server expands into shifts over a range of dates. Hours are
                 wall-clock minutes from midnight in the time zone of the schedule's calendar, so a shift
                 keeps its hours across a daylight saving change.
        CreateAgentsWorkingScheduleShiftsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/AgentWorkingSchedule'
                skipped:
                    type: array
                    items:
                        $ref: '#/components/schemas/Violation'
                    description: |-
                        Days the request left without shifts, and why: storage.shift.absence, or
                         storage.shift.locked_date with the schedule that holds the date.
        CreateForecastCalculationRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ForecastCalculation'
        CreateForecastCalculationResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ForecastCalculation'
        CreatePauseTemplateRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/PauseTemplate'
        CreatePauseTemplateResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/PauseTemplate'
        CreateShiftTemplateRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ShiftTemplate'
        CreateShiftTemplateResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/ShiftTemplate'
        CreateWorkingConditionRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingCondition'
        CreateWorkingConditionResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingCondition'
        CreateWorkingScheduleRequest:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingSchedule'
        CreateWorkingScheduleResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/WorkingSchedule'
        DateRange:
            type: object
            properties:
                from:
                    type: string
                to:
                    type: string
                    description: The last day, included.
            description: |-
                DateRange is an inclusive range of calendar dates. A date anywhere in WFM is a day, not
                 an instant: 00:00 UTC of that day in epoch milliseconds, the same for every client
                 whatever its time zone. Any other value is refused, so a local midnight shows up as
                 an error instead of a day shifted by the client's offset.
        DeleteAgentAbsenceResponse:
            type: object
            properties:
                id:
                    type: string
        DeleteAgentWorkingScheduleShiftResponse:
            type: object
            properties:
                id:
                    type: string
        DeleteForecastCalculationResponse:
            type: object
            properties:
                id:
                    type: string
        DeletePauseTemplateResponse:
            type: object
            properties:
                id:
                    type: string
        DeleteShiftTemplateResponse:
            type: object
            properties:
                id:
                    type: string
        DeleteWorkingConditionResponse:
            type: object
            properties:
                id:
                    type: string
        DeleteWorkingScheduleResponse:
            type: object
            properties:
                id:
                    type: string
        DeletedShift:
            type: object
            properties:
                id:
                    type: string
                agent:
                    $ref: '#/components/schemas/LookupEntity'
                schedule:
                    $ref: '#/components/schemas/LookupEntity'
                date:
                    type: string
                    description: 'The working date, a date as in DateRange: 00:00 UTC of the day, epoch milliseconds.'
                startAt:
                    type: string
                    description: Epoch milliseconds.
                endAt:
                    type: string
            description: DeletedShift is a shift an absence deleted.
        ExecuteForecastCalculationResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExecuteForecastCalculationResponse_Forecast'
        ExecuteForecastCalculationResponse_Forecast:
            type: object
            properties:
                timestamp:
                    type: string
                agents:
                    type: string
        FieldPath:
            type: object
            properties:
                elements:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldPathElement'
                    description: '`elements` contains each element of the path, starting from the root and recursing downward.'
            description: |-
                `FieldPath` provides a path to a nested protobuf field.

                 This message provides enough information to render a dotted field path even without protobuf descriptors.
                 It also provides enough information to resolve a nested field through unknown wire data.
        FieldPathElement:
            type: object
            properties:
                fieldNumber:
                    type: integer
                    description: '`field_number` is the field number this path element refers to.'
                    format: int32
                fieldName:
                    type: string
                    description: |-
                        `field_name` contains the field name this path element refers to.
                         This can be used to display a human-readable path even if the field number is unknown.
                fieldType:
                    type: integer
                    description: |-
