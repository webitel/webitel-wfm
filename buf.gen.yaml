version: v2

plugins:
  # Base types for Go. Generates message and enum types.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go/api/wfm
    opt: paths=source_relative

  # Generates Go client and server stubs for the gRPC framework.
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go/api/wfm
    opt: paths=source_relative

  # Generate openapi documentation for api
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.16.0
    out: gen/openapiv2

  - local: [ "go", "run", "github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1" ]
    out: gen/openapiv3

  # Generate Webitel Service APIs specification (such as objclass, method permission access, ...)
  - local: [ "go", "run", "github.com/webitel/webitel-go-kit/cmd/protoc-gen-go-webitel@v0.0.20" ]
    out: gen/go/api/wfm

inputs:
  # - directory: "../protos/wfm"
  - git_repo: "https://github.com/webitel/protos"
    branch: "main"
    subdir: wfm